<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Incognote</title>
<style>
/* Cupertino tokens (subset) */
:root{
  color-scheme: light dark;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --label:#000;--label-secondary:#6e6e73;--label-tertiary:rgba(60,60,67,.3);
  --bg:#fff;--bg-secondary:#f2f2f7;--bg-grouped:#f2f2f7;--bg-grouped-secondary:#fff;--bg-elevated:#fff;
  --fill:rgba(120,120,128,.2);--fill-secondary:rgba(120,120,128,.16);--fill-tertiary:rgba(118,118,128,.12);--fill-quaternary:rgba(116,116,128,.08);--fill-raised:#fff;
  --separator:rgba(60,60,67,.29);--edge:rgba(0,0,0,0);
  --accent:#0071e3;--on-accent:#fff;--link:#0063c7;--accent-soft:rgba(0,113,227,.1);
  --danger:#cc0004;--danger-soft:rgba(255,56,60,.12);--success:#007831;--success-soft:rgba(52,199,89,.14);--warning:#b04500;--warning-soft:rgba(255,141,40,.14);
  --glass:rgba(255,255,255,.62);
  --overlay:rgba(0,0,0,.2);
  --shadow-float:0 12px 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  --shadow-glass:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.5),0 0 0 .5px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);
  --shadow-thumb:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);
  --focus-ring:0 0 0 2px #fff,0 0 0 4px #0071e3;
  --ease:cubic-bezier(.42,0,.58,1);--ease-out:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root{
  --label:#fff;--label-secondary:#98989f;--label-tertiary:rgba(235,235,245,.3);
  --bg:#000;--bg-secondary:#1c1c1e;--bg-grouped:#000;--bg-grouped-secondary:#1c1c1e;--bg-elevated:#1c1c1e;
  --fill:rgba(120,120,128,.36);--fill-secondary:rgba(120,120,128,.32);--fill-tertiary:rgba(118,118,128,.24);--fill-quaternary:rgba(118,118,128,.18);--fill-raised:#636366;
  --separator:rgba(84,84,88,.6);
  --link:#319dff;--accent-soft:rgba(41,151,255,.14);
  --danger:#ff666a;--danger-soft:rgba(255,102,106,.16);--success:#4ad968;--success-soft:rgba(74,217,104,.16);--warning:#ffa056;--warning-soft:rgba(255,160,86,.16);
  --glass:rgba(44,44,46,.58);--overlay:rgba(0,0,0,.48);
  --shadow-float:0 12px 40px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  --shadow-glass:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.1),0 0 0 .5px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --focus-ring:0 0 0 2px #000,0 0 0 4px #319dff;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-grouped);color:var(--label);font-family:var(--font-sans);font-size:17px;line-height:22px;letter-spacing:-.43px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.ic{flex:none;display:inline-block;vertical-align:middle}
[hidden]{display:none!important}
.footnote{font-size:13px;line-height:18px;letter-spacing:-.08px}
.caption{font-size:12px;line-height:16px;letter-spacing:0}
.sub{font-size:15px;line-height:20px;letter-spacing:-.23px}
.secondary{color:var(--label-secondary)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border:0;border-radius:999px;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.23px;cursor:pointer;white-space:nowrap;transition:transform .15s var(--ease),opacity .15s var(--ease),filter .15s var(--ease);user-select:none}
.btn:active{transform:scale(.97)}
.btn.filled{background:var(--accent);color:var(--on-accent)}
.btn.filled:hover{filter:brightness(1.08)}
.btn.gray{background:var(--fill-tertiary);color:var(--label)}
.btn.tinted{background:var(--accent-soft);color:var(--link)}
.btn.plain{background:none;color:var(--link);padding:0 8px}
.btn.plain:active{opacity:.5;transform:none}
.btn.icon{width:34px;padding:0}
.btn.large{height:50px;padding:0 28px;font-size:17px;line-height:22px;letter-spacing:-.43px}
.btn.small{height:28px;padding:0 12px;font-size:13px}
.btn:disabled{background:var(--fill-tertiary);color:var(--label-tertiary);cursor:default;transform:none}

/* segmented */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;height:32px;padding:2px;border-radius:999px;background:var(--fill-tertiary)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:0 16px;border-radius:999px;font-size:13px;line-height:18px;cursor:pointer;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--fill-raised);box-shadow:var(--shadow-thumb);font-weight:600}

/* ===== welcome ===== */
#welcome{position:relative;min-height:100%;display:flex;justify-content:center;padding:12vh 16px 64px}
#welcome .inner{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.tile{width:72px;height:72px;border-radius:23%;background:#0088ff;color:#fff;display:grid;place-items:center}
.large-title{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px;margin:0;text-wrap:balance}
#welcome p{margin:0;color:var(--label-secondary);text-wrap:balance}
.notice{width:100%;padding:14px 16px;border-radius:18px;background:var(--warning-soft);color:var(--label);text-align:left;font-size:15px;line-height:20px}
.group{width:100%;text-align:left}
.group-h{padding:0 16px 6px;font-size:13px;line-height:18px;color:var(--label-secondary)}
.group-b{background:var(--bg-grouped-secondary);border-radius:26px;padding:6px;box-shadow:inset 0 0 0 1px var(--edge)}
.group-f{padding:6px 16px 0;font-size:13px;line-height:18px;color:var(--label-secondary)}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:20px;cursor:pointer}
.row:hover{background:var(--fill-quaternary)}
.row:focus-visible{box-shadow:var(--focus-ring)}
.row .mini{width:29px;height:29px;border-radius:23%;background:#0088ff;color:#fff;display:grid;place-items:center;flex:none}
.row .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-actions{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#w-pick{min-width:240px;max-width:100%}
#w-pick .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.w-hint{max-width:440px;margin-top:-8px;color:var(--label-secondary);text-wrap:pretty}
.w-alt{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px}
.rrow{display:flex;align-items:center;gap:2px}
.rrow .row{flex:1;min-width:0}
.rrow .rm{flex:none;color:var(--label-secondary)}

/* ===== app layout ===== */
#app{height:100vh;display:flex;overflow:hidden}
#side{flex:0 0 280px;width:280px;min-width:0;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.panel{flex:1;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;border-radius:26px;padding:12px 8px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:var(--shadow-glass)}
.side-title{margin:6px 4px 10px 12px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.side-title>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-btn{flex:none;letter-spacing:0}
#welcome>.lang-btn{position:absolute;top:16px;right:16px}
.fakesearch{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:calc(100% - 8px);margin:0 4px 10px;height:36px;padding:0 10px;border-radius:999px;background:var(--fill-tertiary);color:var(--label-secondary);cursor:text}
.fakesearch kbd{margin-left:auto;font:inherit;font-size:12px;color:var(--label-secondary)}
.fakesearch:focus-visible{box-shadow:var(--focus-ring)}
.sec-h>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h .ic{flex:none}
.sec-h{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;margin-top:14px;padding:6px 12px;font-size:15px;line-height:20px;font-weight:600;color:var(--label-secondary);cursor:pointer;border-radius:12px}
.sec-h .ic{color:var(--link);transition:transform .25s var(--ease)}
.sec-h[aria-expanded="false"] .ic{transform:rotate(-90deg)}
.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-width:0;min-height:40px;padding:0 12px;border-radius:18px;cursor:pointer;font-size:17px;line-height:22px}
.item .ic.lead{color:var(--link)}
.item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-size:15px;color:var(--label-secondary);font-variant-numeric:tabular-nums}
.item:hover:not(.sel){background:var(--fill-quaternary)}
.item.sel{background:var(--accent);color:var(--on-accent)}
.item.sel .ic.lead,.item.sel .cnt,.item.sel .twisty{color:var(--on-accent)}
.item:focus-visible{box-shadow:var(--focus-ring)}
.twisty{all:unset;display:grid;place-items:center;width:16px;height:16px;margin-left:-6px;color:var(--label-secondary);border-radius:4px;transition:transform .25s var(--ease)}
.twisty.closed{transform:rotate(-90deg)}
.twisty.none{visibility:hidden}
.side-foot{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:8px 12px 8px 16px;border-radius:20px;cursor:pointer}
.side-foot:hover{background:var(--fill-quaternary)}
.side-foot:focus-visible{box-shadow:var(--focus-ring)}
.side-foot .txt{flex:1;min-width:0}
.side-foot .txt>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .chg{flex:none;display:flex;align-items:center;gap:2px;font-size:13px;line-height:18px;font-weight:600;color:var(--link)}
.menu .cur{flex:none;color:var(--link)}
.menu .mrow{display:flex;align-items:center;gap:2px}
.menu .mrow>button:first-child{flex:1;min-width:0}
.menu button.rm{flex:none;width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;color:var(--label-secondary)}
.menu button.rm:hover{color:var(--label)}
.menu button:focus-visible{box-shadow:var(--focus-ring)}
.menu .fm-h{padding:6px 14px 2px;font-size:13px;line-height:18px;color:var(--label-secondary)}

#list{flex:0 0 320px;width:320px;min-width:0;padding:20px 8px;display:flex;flex-direction:column;gap:12px;min-height:0}
.list-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 4px 0 12px;min-width:0}
.list-h .btn{flex:none}
.list-h h2{margin:0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-b{flex:1;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;background:var(--bg-grouped-secondary);border-radius:26px;padding:6px;box-shadow:inset 0 0 0 1px var(--edge)}
.note{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;min-width:0;padding:10px 14px;border-radius:20px;cursor:pointer;position:relative}
.note+.note::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--separator)}
.note.sel::before,.note.sel+.note::before{display:none}
.note:hover:not(.sel){background:var(--fill-quaternary)}
.note.sel{background:var(--fill-tertiary)}
.note:focus-visible{box-shadow:var(--focus-ring)}
.note .t{font-size:15px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .m{display:flex;gap:8px;min-width:0;font-size:15px;line-height:20px}
.note .m .d{flex:none}
.note .m .s{color:var(--label-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--label-secondary);font-size:15px;line-height:20px}

#main{flex:1;min-width:0;padding:8px 8px 8px 4px;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border-radius:26px;box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 24px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 200px;overflow:hidden;white-space:nowrap;font-size:15px;line-height:20px;color:var(--label-secondary)}
.crumb .ic{flex:none}
.crumb span{flex:0 1 auto;min-width:2.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb span:last-child{flex-shrink:1;min-width:0;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--label-secondary)}
.status .dot{width:8px;height:8px;border-radius:99px;background:var(--warning)}
.status.saved .dot{background:var(--success)}
.scroll{flex:1;min-height:0;overflow:auto}
.placeholder{height:100%;display:grid;place-items:center;color:var(--label-secondary);text-align:center;padding:24px}

/* rendered markdown */
.md{max-width:692px;margin:0 auto;padding:24px 32px 96px;font-size:17px;line-height:27px;letter-spacing:-.2px;overflow-wrap:anywhere;min-width:0}
.md th,.md td{overflow-wrap:anywhere;min-width:6em}
.md pre,.md pre code{overflow-wrap:normal;white-space:pre}
.props{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:4px 16px;margin:0 0 20px;padding:12px 16px;border-radius:12px;background:var(--bg-secondary);font-size:13px;line-height:18px}
.props dt{color:var(--label-secondary);overflow-wrap:anywhere;min-width:0}
.props dd{margin:0;overflow-wrap:anywhere}
.md .meta{margin:-8px 0 20px;font-size:13px;line-height:18px;color:var(--label-secondary)}
.md h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px;margin:8px 0 16px;text-wrap:balance}
.md h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px;margin:32px 0 12px}
.md h3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px;margin:28px 0 10px}
.md h4,.md h5,.md h6{font-size:17px;line-height:22px;font-weight:600;margin:24px 0 8px}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px;padding-left:24px}
.md li{margin:4px 0}
.md li>p{margin:0 0 6px}
.md li.task{list-style:none;margin-left:-24px;display:flex;gap:10px;align-items:flex-start}
.md li.task>input{margin-top:5px}
.md li.task.done>.tbody{color:var(--label-secondary);text-decoration:line-through}
.md input[type=checkbox]{appearance:none;flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--label-tertiary);background:var(--bg);display:grid;place-items:center;cursor:pointer;margin:0}
.md input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.md input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.wikilink{background:var(--accent-soft);border-radius:6px;padding:0 4px}
.md a.wikilink.missing{background:none;color:var(--label-secondary);text-decoration:underline dashed;text-underline-offset:3px}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 16px;color:var(--label-secondary);box-shadow:inset 3px 0 0 var(--fill)}
.md code{font-family:var(--font-mono);font-size:.88em;padding:1px 6px;border-radius:6px;background:var(--fill-tertiary)}
.md pre{margin:0 0 16px;padding:14px 18px;border-radius:12px;background:var(--bg-secondary);overflow-x:auto;font-size:14px;line-height:22px}
.md pre code{padding:0;background:none;font-size:inherit}
.md hr{border:0;height:1px;background:var(--separator);margin:28px 0}
.md img{max-width:100%;border-radius:12px;display:block;margin:4px 0}
.md .img-missing{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--bg-secondary);color:var(--label-secondary);font-size:13px;line-height:18px}
.md .tw{overflow-x:auto;margin:0 0 16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--separator)}
.md table{border-collapse:collapse;width:100%;font-size:15px;line-height:20px}
.md th,.md td{padding:9px 14px;text-align:left;vertical-align:top}
.md thead tr{background:var(--bg-secondary)}
.md th{font-weight:600}
.md tbody tr{border-top:1px solid var(--separator)}
.md mark,.hit{background:var(--accent-soft);color:var(--link);border-radius:4px;padding:0 2px}
.md mark.flash{background:#ffcc00;color:#000;transition:background 1.5s var(--ease)}
.backlinks{margin-top:48px;padding-top:20px;border-top:1px solid var(--separator)}
.backlinks h3{margin:0 0 10px;font-size:13px;line-height:18px;font-weight:600;color:var(--label-secondary);letter-spacing:-.08px}
.bl{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 14px;border-radius:18px;cursor:pointer;background:var(--bg-secondary);margin-bottom:6px}
.bl:hover{background:var(--fill-tertiary)}
.bl .t{font-size:15px;line-height:20px;font-weight:600;color:var(--link)}
.bl .s{font-size:13px;line-height:18px;color:var(--label-secondary)}

/* editor */
.editor-wrap{flex:1;min-height:0;display:flex;justify-content:center;background:var(--bg)}
#ed{flex:1;max-width:760px;width:100%;height:100%;border:0;outline:none;resize:none;padding:24px 32px 96px;background:transparent;color:var(--label);font-family:var(--font-mono);font-size:15px;line-height:26px;letter-spacing:0;tab-size:2}
#ed:focus-visible{box-shadow:none}
.statusbar{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:8px 24px 12px;border-top:1px solid var(--separator);font-size:12px;line-height:16px;color:var(--label-secondary)}

/* conflict bar & differences */
.cbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 12px 8px;padding:10px 12px 10px 16px;border-radius:18px;background:var(--warning-soft);font-size:15px;line-height:20px}
.cbar-ic{flex:none;display:flex;color:var(--warning)}
.cbar-t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.cbar-b{display:flex;flex-wrap:wrap;gap:8px}
.diff{max-width:900px;margin:0 auto;padding:12px 24px 96px;font-family:var(--font-mono);font-size:13px;line-height:20px;letter-spacing:0}
.diff .lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-family:var(--font-sans);font-size:13px;line-height:18px;color:var(--label-secondary)}
.diff .lg span::before{content:attr(data-s);display:inline-block;width:18px;margin-right:6px;border-radius:4px;text-align:center;font-family:var(--font-mono);color:var(--label)}
.diff .lg .del::before,.dl.del{background:var(--danger-soft)}
.diff .lg .add::before,.dl.add{background:var(--success-soft)}
.dl{position:relative;min-height:20px;padding:0 8px 0 28px;white-space:pre-wrap;overflow-wrap:anywhere}
.dl::before{content:attr(data-s);position:absolute;left:10px;color:var(--label-secondary)}
.dl.del+.dl:not(.del),.dl:not(.del)+.dl.del,.dl.add+.dl:not(.add),.dl:not(.add)+.dl.add{margin-top:2px}
.dl.gap{padding:6px 28px;font-family:var(--font-sans);color:var(--label-secondary)}
.diff .none{padding:40px 0;text-align:center;font-family:var(--font-sans);color:var(--label-secondary)}
.udot{display:inline-block;width:8px;height:8px;margin:0 6px 0 0;border-radius:99px;background:var(--accent);vertical-align:2px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;overflow:auto}
.sheet{width:100%;max-width:540px;display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px;background:var(--bg-elevated);border-radius:36px;box-shadow:var(--shadow-float)}
.sheet p{margin:0;text-wrap:pretty}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.sheet .group-b{background:var(--bg-secondary)}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;min-width:0}
.frow+.frow{box-shadow:inset 0 1px 0 var(--separator)}
.frow .mini{width:29px;height:29px;border-radius:23%;background:#0088ff;color:#fff;display:grid;place-items:center;flex:none}
.frow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .p{font-family:var(--font-mono);font-size:14px;line-height:20px;letter-spacing:0;overflow-wrap:anywhere}
.chip{flex:none;padding:2px 10px;border-radius:999px;font-size:13px;line-height:18px;background:var(--fill-tertiary);color:var(--label-secondary)}
.chip.new{background:var(--accent-soft);color:var(--link)}
.sheet-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:4px}

/* popovers */
.menu{position:fixed;z-index:30;min-width:220px;max-width:min(360px,calc(100vw - 24px));padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:var(--shadow-glass),var(--shadow-float)}
.menu button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:10px 14px;border-radius:20px;cursor:pointer;font-size:17px;line-height:22px}
.menu button:hover,.menu button.on{background:var(--fill-tertiary)}
.menu button>span:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button .s{flex:0 1 auto;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--label-secondary)}
.menu button .ic{flex:none}
.menu .sep{height:1px;margin:4px 14px;background:var(--separator)}

#palette{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal{width:100%;max-width:680px;max-height:72vh;display:flex;flex-direction:column;background:var(--bg-elevated);border-radius:36px;box-shadow:var(--shadow-float);padding:12px}
.pal-top{display:flex;align-items:center;gap:10px;padding:4px}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--fill-tertiary);color:var(--label-secondary)}
.searchbox input:focus-visible{box-shadow:none}
.searchbox:focus-within{box-shadow:var(--focus-ring)}
.searchbox input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--label);font:inherit;font-size:17px}
.pal-body{flex:1;min-height:0;overflow:auto;padding-top:4px}
.pal-g{padding:10px 16px 4px;font-size:13px;line-height:18px;font-weight:600;color:var(--label-secondary)}
.res{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px 16px;border-radius:24px;cursor:pointer}
.res.on{background:var(--fill-tertiary)}
.res .ic{margin-top:1px;color:var(--label-secondary)}
.res .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res .t{font-weight:600}
.res .s{font-size:15px;line-height:20px;color:var(--label-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .r{flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-size:13px;line-height:18px;color:var(--label-secondary)}
.pal-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:10px 16px 4px;margin-top:6px;border-top:1px solid var(--separator);font-size:12px;line-height:16px;color:var(--label-secondary)}

#suggest{position:fixed;z-index:25;width:min(340px,calc(100vw - 24px));max-width:min(340px,calc(100vw - 24px));max-height:320px;overflow-x:hidden;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow-glass),var(--shadow-float);font-size:15px;line-height:20px}

#toast-b{margin:-4px -10px -4px 0;flex:none}

/* first use: new-library sheet, empty folder guide, Markdown help */
#sheet{position:fixed;inset:0;z-index:35;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;overflow:auto}
.sheet{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 24px 20px;background:var(--bg-elevated);border-radius:36px;box-shadow:var(--shadow-float);text-align:center}
.sheet h2{margin:4px 0 0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.sheet p{margin:0;color:var(--label-secondary);font-size:15px;line-height:20px;text-wrap:pretty}
.tile.sm{width:56px;height:56px}
.steps{width:100%;margin:4px 0;padding:6px 16px;list-style:none;counter-reset:st;text-align:left;background:var(--bg-secondary);border-radius:20px}
.steps li{counter-increment:st;display:flex;gap:12px;padding:10px 0;font-size:15px;line-height:20px}
.steps li+li{border-top:1px solid var(--separator)}
.steps li::before{content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;line-height:22px;font-weight:600;text-align:center}
.sheet-actions{display:flex;gap:10px;width:100%;margin-top:8px}
.sheet-actions .btn{flex:1;height:44px}
.guide{max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px}
.guide h2{margin:4px 0 0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px;color:var(--label);text-wrap:balance}
.guide p{margin:0;font-size:15px;line-height:20px;text-wrap:pretty}
.guide .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.guide .acts .btn{height:44px;padding:0 20px}
.guide .alt{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px}
.tile.warn{background:#ff8d28}
.item.more-empty{font-size:15px;color:var(--label-secondary)}
.item.more-empty .lbl{white-space:normal}
.linkbtn{all:unset;color:var(--link);cursor:pointer;border-radius:4px}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{box-shadow:var(--focus-ring)}
.help{background:var(--bg-elevated);-webkit-backdrop-filter:none;backdrop-filter:none;width:min(420px,calc(100vw - 24px));max-width:min(420px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 24px));overflow:auto;padding:14px 16px}
.help h3{margin:0 0 8px;font-size:15px;line-height:20px;font-weight:600}
.help dl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px;line-height:18px}
.help dt{min-width:0;overflow-wrap:anywhere}
.help dt code{font-family:var(--font-mono);font-size:12px;padding:1px 5px;border-radius:5px;background:var(--fill-tertiary);white-space:pre-wrap}
.help dd{margin:0;color:var(--label-secondary)}
.help .keys{margin-top:12px;padding-top:10px;border-top:1px solid var(--separator);font-size:12px;line-height:16px;color:var(--label-secondary)}

@media (max-width: 1100px){#list{flex-basis:280px;width:280px}#side{flex-basis:240px;width:240px}.side-title{font-size:24px;letter-spacing:0}.wide-only{display:none}.lang-btn{padding-left:8px;padding-right:8px}}
@media (max-width: 860px){#app{flex-direction:column;height:auto;overflow:visible}#side,#list{flex:none;width:auto;max-height:none}#side .panel{max-height:50vh}.list-b{max-height:50vh}#main{min-height:80vh}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (prefers-reduced-transparency: reduce){.panel,.menu,#toast{background:var(--bg-elevated);backdrop-filter:none;-webkit-backdrop-filter:none}}

<script>
"use strict";
const ICONS = /*@@ICONS@@*/;
function icon(name, size = 18, cls = '') {
  const g = ICONS[name]; if (!g) return '';
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${g.d}</svg>`;
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMG_RE = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i;
const MD_RE = /\.(md|markdown)$/i;
// Instructions for coding agents at the top of the folder (CLAUDE.md, AGENTS.md) are files, not notes: kept out of lists, search and links.
const SYS_RE = /^(claude|agents)\.md$/i;
const NONCE = Math.random().toString(36).slice(2, 8);
const A = { wiki: 'data-w' + NONCE, local: 'data-l' + NONCE, byname: 'data-b' + NONCE, task: 'data-t' + NONCE, open: 'data-o' + NONCE };
const ds = (el, k) => el.getAttribute(A[k]);

/* ---------- state ---------- */
const S = {
  root: null, rootName: '', readonly: false,
  notes: new Map(),   // path -> note
  files: new Map(),   // path -> FileSystemFileHandle | File (non-markdown)
  dirs: new Map(),    // folder path ('' = root) -> FileSystemDirectoryHandle | null
  view: { kind: 'all', folder: '' },
  current: null, mode: 'read', dirty: false, gen: 0, scanning: null, conflict: false,
  closed: new Set(), treeOpen: true,
  imgUrls: new Map(), saving: null, timer: 0, opening: false,
  walked: 0, stopScan: false, showEmpty: false
};

/* ---------- persistence of the folder handle (IndexedDB, this computer only) ---------- */
const idb = {
  db() { return new Promise((res, rej) => { const r = indexedDB.open('incognote', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.db(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.db(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
};
// Recently opened folders, newest first. Each entry keeps the folder handle so it can be reopened without the picker.
const folders = {
  MAX: 6,
  async list() {
    let r = await idb.get('recents');
    if (!Array.isArray(r)) { const old = await idb.get('root'); r = old ? [{ h: old, name: old.name, t: 0 }] : []; }  // data from v1.0
    return r.filter((x) => x && x.h && x.h.kind === 'directory');
  },
  async same(a, b) { try { return a === b || await a.isSameEntry(b); } catch (e) { return false; } },
  async remember(h) {
    const out = [{ h, name: h.name, t: Date.now() }];
    for (const x of await this.list()) if (!(await this.same(x.h, h))) out.push(x);
    await idb.set('recents', out.slice(0, this.MAX));
  },
  async forget(h) {
    const out = [];
    for (const x of await this.list()) if (!(await this.same(x.h, h))) out.push(x);
    await idb.set('recents', out);
  }
};
const prefs = {
  get(k, d) { try { const v = localStorage.getItem('incognote.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('incognote.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- language ---------- */
// Interface text in Chinese and English. Default follows the browser; the choice is remembered.
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || '') || /Mac OS X/.test(navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl+';
const IS_MOBILE = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent) || (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
const plural = (n, one, many) => `${n.toLocaleString('en-US')} ${n === 1 ? one : many}`;
const STR = {

    'w.unsupported': '这个浏览器不能保存到本地文件夹，只能先以只读方式浏览。要编辑和保存，请用电脑上的 Chrome 或 Edge 打开这个文件。浏览器可能会把选择文件夹叫作“上传”，其实文件只在这个页面里读取，不会离开你的电脑。',
    'w.mobile': '手机和平板上的浏览器还不能打开本地的笔记文件夹。请在电脑上用 Chrome 或 Edge 打开这个文件。',
    'nl.title': '新建笔记库', 'nl.desc': '笔记会存在你电脑上的一个文件夹里。点“继续”后会弹出选择文件夹的窗口：',
    'nl.s1': '找一个放笔记的位置，比如“文稿”。',
    'nl.s2': IS_MAC ? '点左下角的“新建文件夹”，起个名字，比如“笔记”。' : '点窗口上方的“新建文件夹”，起个名字，比如“笔记”。',

    'nl.note': '选的文件夹里如果已经有文件，会在里面另建一个“Incognote 笔记”文件夹，不会动原来的文件。“文稿”“桌面”“下载”这几个文件夹本身 Chrome 不让直接选，选它们里面的文件夹就行。',
    'nl.go': '继续', 'lib.name': 'Incognote 笔记',
    'lib.made': (x) => `笔记库“${x}”已建好，先看看这几篇入门笔记吧`, 'lib.madeIn': (p, x) => `已在“${p}”里新建笔记库“${x}”`, 'lib.fail': '新建笔记库失败：',
    'ep.emptyT': '这个文件夹里还没有笔记', 'ep.emptyD': '每篇笔记都是一个 .md 文件。可以先放几篇入门笔记看看怎么用，也可以直接开始写。',
    'ep.starter': '放入入门笔记', 'ep.write': '写第一篇', 'ep.starterNote': '入门笔记会放进“Incognote 入门”文件夹，用完直接删掉就行。',
    'ep.noMdT': '这里没有 Markdown 笔记', 'ep.noMdD': (n) => `Incognote 只显示 .md 文件，这个文件夹里有 ${n.toLocaleString()} 个其他文件，可能选错了文件夹。`,

const md = window.markdownit({ html: true, linkify: true, breaks: false });
function wikiRule(isEmbed) {
  return (state, silent) => {
    const s = state.src, p = state.pos, off = isEmbed ? 1 : 0;
    if (isEmbed && s.charCodeAt(p) !== 0x21) return false;
    if (s.charCodeAt(p + off) !== 0x5B || s.charCodeAt(p + off + 1) !== 0x5B) return false;
    const end = s.indexOf(']]', p + off + 2);
    if (end < 0) return false;
    const inner = s.slice(p + off + 2, end);
    if (!inner.trim() || inner.includes('\n') || inner.includes('[')) return false;
    if (!silent) {
      const bar = inner.indexOf('|');
      const target = (bar >= 0 ? inner.slice(0, bar) : inner).trim();
      const label = (bar >= 0 ? inner.slice(bar + 1) : inner).trim();
      const tok = state.push(isEmbed ? 'wikiembed' : 'wikilink', '', 0);
      tok.meta = { target, label };
    }
    state.pos = end + 2;
    return true;
  };
}

/* ---------- paths & links ---------- */
const dirOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');

}
function resolveNote(target, fromDir) {
  if (!target) return null;
  const t = target.replace(MD_RE, '').trim().toLowerCase();
  // exact path (relative to root or to the current folder)
  for (const cand of [t, fromDir != null ? joinPath(fromDir, t).toLowerCase() : null]) {
    if (!cand) continue;
    for (const n of S.notes.values()) if (!n.sys && n.path.replace(MD_RE, '').toLowerCase() === cand) return n;
  }
  // by file name, nearest to the current folder first
  let best = null;
  for (const n of S.notes.values()) {
    if (!n.sys && n.name.toLowerCase() === baseOf(t)) {
      if (!best || (fromDir != null && n.folder === fromDir)) best = n;
    }
  }

}
function resolveFile(rel, fromDir, byName) {
  let p = rel;
  try { p = decodeURIComponent(rel); } catch (e) {}
  p = p.split('#')[0].split('?')[0];
  const cands = [joinPath(fromDir, p), joinPath('', p)];
  for (const c of cands) if (S.files.has(c)) return c;
  if (byName || !p.includes('/')) {
    const want = baseOf(p).toLowerCase();
    for (const k of S.files.keys()) if (baseOf(k).toLowerCase() === want) return k;
  }
  return null;
}

/* ---------- indexing ---------- */
// YAML frontmatter at the very top: shown as a small properties block, ignored for titles and snippets.
function splitFrontmatter(text) {
  const m = text.match(/^\uFEFF?---[ \t]*\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/);
  if (!m) return { fm: null, body: text, lines: 0 };
  const fm = [];
  for (const line of m[1].split(/\r?\n/)) {
    if (!line.trim() || /^\s*#/.test(line)) continue;
    const kv = line.match(/^([A-Za-z0-9_\u4e00-\u9fff][\w\u4e00-\u9fff .-]*):(?:\s+(.*))?$/);
    if (kv) { const v = (kv[2] || '').trim(); fm.push([kv[1].trim(), /^(["']).*\1$/.test(v) ? v.slice(1, -1) : v]); }
    else if (fm.length && /^(\s+|-\s)/.test(line)) { const last = fm[fm.length - 1]; const v = line.trim().replace(/^-\s*/, ''); last[1] += (last[1] ? ', ' : '') + v; }
    else return { fm: null, body: text, lines: 0 };     // not YAML: a leading --- divider, keep everything
  }
  if (!fm.length) return { fm: null, body: text, lines: 0 };
  return { fm, body: text.slice(m[0].length), lines: m[0].split('\n').length - 1 };
}
const shortUrls = (t) => t.replace(/https?:\/\/([A-Za-z0-9.-]+(?::\d+)?)[A-Za-z0-9\-._~:/?#@!$&*+,;=%]*/g, (m, host) => host.replace(/^www\./, ''));
// Blank out fenced/indented code and inline code so indexing ignores what is inside them (line count is kept).
function stripCode(text) {
  const out = []; let fence = null;
  for (const line of text.split('\n')) {
    const f = line.match(/^\s{0,3}(`{3,}|~{3,})/);
    if (fence) { out.push(''); if (f && f[1][0] === fence[0] && f[1].length >= fence.length) fence = null; continue; }
    if (f) { fence = f[1]; out.push(''); continue; }
    out.push(line.replace(/(`+)[^`\n]*?\1/g, (m) => ' '.repeat(m.length)));
  }
  return out.join('\n');
}
function analyse(n) {
  n.sys = SYS_RE.test(n.path);
  const { fm, body } = splitFrontmatter(n.text);
  const text = body;
  const plain = stripCode(text);
  const h1 = plain.match(/^#\s+(.+?)\s*#*\s*$/m);
  const fmTitle = fm && (fm.find(([k]) => k.toLowerCase() === 'title') || [])[1];
  n.fmTitle = fmTitle || '';
  n.title = h1 ? h1[1].trim() : fmTitle || n.name;
  n.lower = n.text.toLowerCase();
  n.body = body; n.bodyLower = body.toLowerCase();
  let snip = '';
  for (const line of plain.split('\n')) {
    const l = line.trim();
    if (!l || /^#{1,6}\s/.test(l) || /^(```|~~~|---|\||<)/.test(l)) continue;
    snip = l.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g, (m, a, b) => b || a)
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`>#~]/g, '').replace(/^\s*[-+]\s+(\[[ xX]\]\s*)?/, '').trim();
    snip = shortUrls(snip);

  }

  const re = /\[\[([^\]\n|#]+)(?:#[^\]\n|]*)?(?:\|[^\]\n]*)?\]\]/g;

  while ((m = re.exec(plainAll))) links.add(m[1].trim().toLowerCase().replace(MD_RE, ''));

}
function backlinksOf(note) {
  const keys = new Set([note.name.toLowerCase(), note.path.replace(MD_RE, '').toLowerCase()]);
  const out = [];
  for (const n of S.notes.values()) {
    if (n === note || n.sys) continue;
    let hit = false;
    for (const l of n.links) if (keys.has(l) && resolveNote(l, n.folder) === note) { hit = true; break; }
    if (!hit) continue;
    const idx = stripCode(n.text).toLowerCase().search(new RegExp('\\[\\[(' + [...keys].map(reEsc).join('|') + ')', 'i'));
    const line = idx >= 0 ? n.text.slice(n.text.lastIndexOf('\n', idx) + 1, (n.text.indexOf('\n', idx) + 1 || n.text.length + 1) - 1) : '';
    out.push({ n, ctx: shortUrls(tidySnip(line.slice(0, 400))).trim().slice(0, 140) });

/* ---------- loading a folder ---------- */
async function walk(dir, prefix, mdList) {
  S.dirs.set(prefix, dir);
  for await (const [name, h] of dir.entries()) {
    if (S.stopScan) throw new DOMException('Stopped', 'AbortError');
    if (name.startsWith('.') || name === 'node_modules') continue;
    S.walked++;
    const p = prefix ? prefix + '/' + name : name;
    if (h.kind === 'directory') await walk(h, p, mdList);
    else if (MD_RE.test(name)) mdList.push([p, h]);
    else S.files.set(p, h);
  }
}
async function loadFromHandle(root) {
  if (S.scanning) { try { await S.scanning; } catch (e) {} }   // let a background refresh of the old folder finish first
  S.gen++;
  S.root = root; S.rootName = root.name; S.readonly = false;
  S.notes = new Map(); S.files = new Map(); S.dirs = new Map();
  if ((await scan(true)) === null) throw new Error('interrupted');
  for (const u of S.imgUrls.values()) URL.revokeObjectURL(u);  // image URLs are keyed by path, so they belong to the old folder
  S.imgUrls.clear();
}
async function scan(first) {
  if (S.scanning) return S.scanning;
  S.scanning = (async () => {
    const gen = S.gen;
    const mdList = [], files = new Map(), dirs = new Map();
    const saveFiles = S.files, saveDirs = S.dirs;
    S.files = files; S.dirs = dirs;            // walk() fills these
    try { await walk(S.root, '', mdList); } catch (e) { S.files = saveFiles; S.dirs = saveDirs; throw e; }
    S.files = saveFiles; S.dirs = saveDirs;
    const oldNotes = S.notes, next = new Map();
    let changed = first || mdList.length !== oldNotes.size;
    const queue = mdList.slice(), touched = new Set(), updates = [];
    async function worker() {
      while (queue.length) {
        if (S.stopScan) throw new DOMException('Stopped', 'AbortError');
        const [p, h] = queue.shift();
        const f = await h.getFile();
        const old = oldNotes.get(p);
        if (old && old.mtime === f.lastModified) { next.set(p, old); continue; }
        const text = await f.text();
        if (old && old.text === text) { updates.push([old, h, null, f.lastModified]); next.set(p, old); continue; }
        changed = true; touched.add(p);
        const n = old || { path: p, name: stem(p), folder: dirOf(p), text: '' };
        updates.push([n, h, text, f.lastModified]); next.set(p, n);
      }
    }
    await Promise.all(Array.from({ length: 8 }, worker));
    // A note was saved, created, renamed or deleted meanwhile: drop this pass untouched, the next one will see the changes.
    if (gen !== S.gen || S.saving || S.mutating) return null;
    for (const [n, h, text, mtime] of updates) {
      n.handle = h; n.mtime = mtime; n.gone = false;
      if (text === null) continue;
      n.text = text;
      // The open note keeps its base until the page actually shows the new text (refresh does that), so an edit
      // typed meanwhile is still compared against what the person saw.
      if (n.path !== S.current || n.base == null) n.base = text;
      analyse(n);
    }
    for (const p of oldNotes.keys()) if (!next.has(p)) changed = true;
    // the open note vanished on disk but has unsaved edits: keep it so the edits can still be saved
    if (S.current && S.dirty && !next.has(S.current) && oldNotes.has(S.current)) { const n = oldNotes.get(S.current); n.gone = true; next.set(S.current, n); }
    S.notes = next; S.files = files; S.dirs = dirs;
    S.touched = touched;                       // notes that are new or whose text changed in this pass
    return changed;
  })();
  try { return await S.scanning; } finally { S.scanning = null; }
}
async function loadFromFiles(list) {
  for (const u of S.imgUrls.values()) URL.revokeObjectURL(u);
  S.imgUrls.clear(); S.gen++;
  S.root = null; S.readonly = true; S.notes = new Map(); S.files = new Map(); S.dirs = new Map([['', null]]);
  const arr = Array.from(list);
  S.rootName = arr.length ? arr[0].webkitRelativePath.split('/')[0] : '';
  for (const f of arr) {
    const rel = f.webkitRelativePath.split('/').slice(1).join('/');
    if (!rel || rel.split('/').some((s) => s.startsWith('.') || s === 'node_modules')) continue;
    let d = dirOf(rel); while (d && !S.dirs.has(d)) { S.dirs.set(d, null); d = dirOf(d); }
    if (MD_RE.test(rel)) {
      const t = await f.text();
      const n = { path: rel, name: stem(rel), folder: dirOf(rel), file: f, text: t, base: t, mtime: f.lastModified };
      analyse(n); S.notes.set(rel, n);
    } else S.files.set(rel, f);
  }
}

// A subfolder called `base` (or “base 2”, “base 3”…) that is new or still empty, so nothing existing is ever overwritten.
async function freshDir(parent, base) {
  for (let i = 1; i < 100; i++) {
    const name = i === 1 ? base : `${base} ${i}`;
    let h = null;
    try { h = await parent.getDirectoryHandle(name); } catch (e) {
      if (e && e.name === 'TypeMismatchError') continue;     // a file has that name
      if (!e || e.name !== 'NotFoundError') throw e;

    if (!h) return parent.getDirectoryHandle(name, { create: true });
    if (!(await nonDot(h))) return h;

const SG = { open: false, items: [], idx: 0, start: 0 };

async function createNote(folder, base, body) {

    let name = clean, i = 2;
    while (S.notes.has(joinPath(folder, name + '.md')) || (!folder && SYS_RE.test(name + '.md')) || (await exists(dir, name + '.md'))) name = `${clean} ${i++}`;
    const fh = await dir.getFileHandle(name + '.md', { create: true });
    const w = await fh.createWritable(); await w.write(body); await w.close();
    const f = await fh.getFile();
    path = joinPath(folder, name + '.md');

    S.gen++; S.notes.set(path, n);

// Rewrite [[links]] in `text` (outside code) that point at `note`, giving them the new name.
function relink(text, fromDir, note, newName) {
  let fence = null, count = 0;
  const out = text.split('\n').map((line) => {
    const f = line.match(/^\s{0,3}(`{3,}|~{3,})/);
    if (fence) { if (f && f[1][0] === fence[0] && f[1].length >= fence.length) fence = null; return line; }
    if (f) { fence = f[1]; return line; }
    // leave inline code alone
    return line.split(/(`+[^`\n]*?`+)/).map((part, i) => i % 2 ? part : part.replace(/(!?)\[\[([^\]\n|#]+)((?:#[^\]\n|]*)?(?:\|[^\]\n]*)?)\]\]/g, (m, bang, target, rest) => {
      if (resolveNote(target.trim(), fromDir) !== note) return m;
      const t = target.trim();
      const dir = t.includes('/') ? t.slice(0, t.lastIndexOf('/') + 1) : '';
      const ext = MD_RE.test(t) ? t.match(MD_RE)[0] : '';

      return `${bang}[[${dir}${newName}${ext}${rest}]]`;

      const th = await dir.getFileHandle(tmp, { create: true });

      await dir.removeEntry(baseOf(n.path));
      fh = await dir.getFileHandle(name + '.md', { create: true });
      w = await fh.createWritable(); await w.write(body); await w.close();
      await dir.removeEntry(tmp);
    } else {

      await dir.removeEntry(baseOf(n.path));

// Line diff of the file on disk (a) against the unsaved version (b): common ends trimmed, LCS in between.
function lineDiff(a, b) {
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;

    const W = M + 1, L = new Uint32Array((N + 1) * W);

    let i = 0, j = 0;
    while (i < N && j < M) {
      if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
      else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) out.push(['-', A[i++]]);
      else out.push(['+', B[j++]]);
    }
    while (i < N) out.push(['-', A[i++]]);
    while (j < M) out.push(['+', B[j++]]);
  }
  for (let i = a.length - q; i < a.length; i++) out.push([' ', a[i]]);
  return { ops: out, big };
}

2. 起文件名：简短、看得出内容，不含 \`\\ / : * ? " < > | # ^ [ ]\`。用 \`find . -iname "名字.md" -not -path "*/.*"\` 确认全库没有同名笔记（不分文件夹、不分大小写），有就换个名字。
3. 正文以 \`# 标题\` 开头。如果同文件夹的笔记普遍有 frontmatter，照着它们的字段写。
4. 用到的图片放进这个文件夹的 \`assets/\`，用 \`![](assets/文件名)\` 引用。
5. 有相关的已有笔记，就用 \`[[笔记名]]\` 链过去。
6. 告诉用户新笔记的路径。

## 改名或移动笔记
Incognote 的双链按文件名匹配，所以改名必须同步改链接；移动到别的文件夹时，写了路径的链接（\`[[旧文件夹/笔记名]]\`）也要改。
1. 记下旧路径和旧文件名（不含 \`.md\`）。
2. 找出所有引用。双链匹配不分大小写，分别搜这几种写法（\`-i\` 不分大小写，\`-F\` 按原文匹配）：
   \`grep -rniF --include="*.md" --exclude-dir=".?*" -e "[[旧名]]" -e "[[旧名|" -e "[[旧名#" -e "/旧名]]" -e "/旧名|" -e "/旧名#" -e "旧名.md)" .\`
   这样也会找到 \`![[旧名]]\` 和写了路径的 \`[[文件夹/旧名]]\`，但不会误中 \`[[旧名 2]]\` 这类名字更长的笔记。逐条看结果：代码块和行内代码里的不要改；写了路径的，确认路径确实指向这篇笔记。
3. 列出要改的笔记给用户看；超过 5 篇先征得同意。
4. 用 \`mv\` 改名或移动，不要先删再建。
5. 逐处替换链接，只换目标部分，保留 \`|显示文字\` 和 \`#小标题\`。例：\`[[旧名|看这里]]\` 改成 \`[[新名|看这里]]\`。
6. 如果移到了别的文件夹，检查这篇笔记里 \`![](assets/…)\` 等相对路径：把图片一起移到新文件夹的 \`assets/\`，或者改路径。
7. 再搜一次旧名，确认没有遗漏。

## 整理体检
只出报告，不直接改。把报告给用户，按用户选的项目再动手。
- 断链：\`[[…]]\` 的目标（去掉 \`|…\` 和 \`#…\`）在全库找不到同名 \`.md\` 文件。
- 同名笔记：不同文件夹里文件名相同（不分大小写），会让双链指向不明。
- 孤立笔记：没有笔记链接到它，它也不链接任何笔记。
- 没用到的图片：\`assets/\` 里没有被任何笔记引用的图片。
- 网络图片：引用 \`http(s)://\` 图片的笔记，Incognote 里不会显示。
- 空笔记、只有标题的笔记。

## 删除笔记
1. 先搜有哪些笔记链接到它（方法同改名第 2 步），告诉用户这些链接会断。
2. 得到用户同意后再删。如果文件夹是 git 仓库，先提交一次。
3. 它的图片如果没有别的笔记在用，问用户要不要一起删。

This folder is a Markdown notebook. It is read and edited with Incognote, a local notes page that runs in the browser. Follow the conventions below when reading and writing notes so they display correctly in Incognote and links keep working.

Incognote created this file. Edit it as you like; Incognote never overwrites it. Step-by-step instructions for creating, renaming and tidying notes are in \`.claude/skills/incognote-notes/SKILL.md\`.

## Files
- Each note is one \`.md\` file in UTF-8. Folders can be nested freely. Folder names can be long and contain spaces or non-ASCII characters, so always quote paths in commands.
- Incognote ignores files and folders whose names start with \`.\`, and \`node_modules\`. \`CLAUDE.md\` and \`AGENTS.md\` at the top level are not notes.
- Leave \`*.crswap\` files alone. Chrome creates them briefly while saving.
- The file name is the note's name. It can't contain \`\\ / : * ? " < > | # ^ [ ]\` or start with \`.\`.
- Avoid two notes with the same name anywhere in the notebook, even in different folders, or \`[[links]]\` become ambiguous.

## Titles
- A note's title is its first \`# heading\`, otherwise the frontmatter \`title\`, otherwise the file name.
- Start new notes with \`# Title\`.

## Frontmatter
- Optional YAML between \`---\` lines at the very top of the file. Incognote shows it as a small properties table.
${f.common.length ? `- Fields commonly used in this notebook: ${f.common.map((k) => '`' + k + '`').join(', ')}. For new notes, follow other notes in the same folder.` : '- This notebook rarely uses frontmatter, so new notes don’t need it.'}
- When editing a note, keep its existing fields, their order and their format.

## Links
- Link notes with \`[[Note name]]\`, \`[[Note name|shown text]]\` or \`[[Note name#Heading]]\`, without \`.md\`.
- Matching: first by path (from the top folder or the current folder), then by file name, ignoring case. With duplicate names the current folder wins. Use a path to be explicit: \`[[Folder/Note name]]\`.
- Ordinary Markdown links work too: \`[text](relative/path.md)\`.
- When renaming or moving a note, update every link that points to it, or those links break.

## Images
- Put images in an \`assets/\` folder next to the note and use a relative path: \`![](assets/image.png)\`. Write spaces in file names as \`%20\`.
- \`![[image.png]]\` also works and finds the image by name anywhere in the notebook.
- Images on the web don’t show in Incognote because it never goes online. Download them into \`assets/\` first if needed.

## Task lists
- \`- [ ] to do\` and \`- [x] done\` can be ticked directly in Incognote.

## When changing notes
- Incognote may have the same note open. It loads your changes automatically, and if the person is editing that note it shows them a conflict to resolve. So change a note in one go rather than in many small edits.

# Managing notes

First read CLAUDE.md at the top of the notebook for its naming, link and image conventions. Below is how to do the common tasks. Always quote paths: folder names can be long and contain spaces or non-ASCII characters.

## Create a note
1. Pick a folder: look at the existing folders and choose the closest match. If unsure, ask, or use the top folder.
2. Choose a short, descriptive file name without \`\\ / : * ? " < > | # ^ [ ]\`. Check with \`find . -iname "name.md" -not -path "*/.*"\` that no note anywhere has that name (any folder, any case); if one does, pick another.
3. Start the text with \`# Title\`. If notes in the same folder generally have frontmatter, use the same fields.
4. Put images in that folder's \`assets/\` and reference them as \`![](assets/file)\`.
5. Link related existing notes with \`[[Note name]]\`.
6. Tell the person where the new note is.

## Rename or move a note
Incognote resolves links by file name, so a rename must update links. When moving to another folder, links written with a path (\`[[Old folder/Note]]\`) must change too.
1. Note the old path and old name (without \`.md\`).
2. Find every reference. Links ignore case, so search each form (\`-i\` ignores case, \`-F\` matches the text literally):
   \`grep -rniF --include="*.md" --exclude-dir=".?*" -e "[[Old name]]" -e "[[Old name|" -e "[[Old name#" -e "/Old name]]" -e "/Old name|" -e "/Old name#" -e "Old name.md)" .\`
   This also finds \`![[Old name]]\` and path forms like \`[[Folder/Old name]]\`, without matching longer names such as \`[[Old name 2]]\`. Check each hit: leave code blocks and inline code alone, and make sure a path form really points to this note.
3. Show the person which notes will change; ask first if it is more than 5.
4. Rename or move with \`mv\`. Don’t delete and recreate.
5. Replace each link’s target only, keeping \`|shown text\` and \`#Heading\`. Example: \`[[Old name|see here]]\` becomes \`[[New name|see here]]\`.
6. If the note moved to another folder, check its relative paths such as \`![](assets/…)\`: move the images to the new folder’s \`assets/\` or fix the paths.
7. Search for the old name once more to make sure nothing was missed.

## Tidy-up check
Report only; don’t change anything. Give the report to the person and act only on the items they choose.
- Broken links: \`[[…]]\` targets (without \`|…\` and \`#…\`) with no matching \`.md\` file anywhere.
- Duplicate names: notes in different folders with the same file name (ignoring case), which make links ambiguous.
- Orphan notes: no note links to them and they link to no note.
- Unused images: files in \`assets/\` that no note references.
- Web images: notes that reference \`http(s)://\` images, which Incognote doesn’t show.
- Empty notes and notes with only a title.

## Delete a note
1. Find which notes link to it (as in step 2 of renaming) and tell the person those links will break.
2. Delete only after the person agrees. If the folder is a git repository, commit first.
3. If its images aren’t used by any other note, ask whether to delete them too.

/* ---------- global search ---------- */
const P = { items: [], idx: 0, terms: [] };
function openPalette() {
  if ($('#app').hidden) return;
  $('#palette').hidden = false; $('#pal-ic').innerHTML = icon('magnifyingglass', 18);
  const q = $('#q'); q.focus(); q.select(); runSearch();
}
function closePalette() { $('#palette').hidden = true; }
$('#pal-cancel').onclick = closePalette;
$('#palette').addEventListener('mousedown', (e) => { if (e.target.id === 'palette') closePalette(); });
$('#q').addEventListener('input', runSearch);
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!P.items.length) return;
    P.idx = (P.idx + (e.key === 'ArrowDown' ? 1 : -1) + P.items.length) % P.items.length; markResult();
  } else if (e.key === 'Enter') { e.preventDefault(); pickResult(P.idx); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
});
function hl(text, terms) {
  const list = terms.filter(Boolean);
  if (!list.length) return esc(text);
  const re = new RegExp(list.map(reEsc).sort((a, b) => b.length - a.length).join('|'), 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(text))) { out += esc(text.slice(last, m.index)) + '<mark class="hit">' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; if (!m[0]) re.lastIndex++; }
  return out + esc(text.slice(last));
}
// Search snippet: around the first hit that is still visible after Markdown markup is tidied
// (body first, front matter only if the body has none).
const tidySnip = (t) => t.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/!?\[\[([^\]|]*)\|?([^\]]*)\]\]/g, (m, a, b) => b || a)
  .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/(^|\n)[ \t]*(#{1,6}\s+|[-+*]\s+(\[[ xX]\]\s+)?|>\s*|```\w*|~~~\w*|---+[ \t]*(?=\n|$))/g, '$1')
  .replace(/\*\*|`/g, '').replace(/\s+/g, ' ');
function snipIn(src, terms) {
  const low = src.toLowerCase();
  if (low.length !== src.length) return null; // case folding changed lengths: indexes would not line up
  for (const t of terms) {
    for (let i = low.indexOf(t), k = 0; i >= 0 && k < 30; i = low.indexOf(t, i + t.length), k++) {
      const ls = src.lastIndexOf('\n', i) + 1, le = src.indexOf('\n', i);
      const from = Math.max(ls, i - 600), to = Math.min(le < 0 ? src.length : le, i + 600);
      const line = shortUrls(tidySnip(src.slice(from, to))).trim();
      const j = line.toLowerCase().indexOf(t);
      if (j < 0) continue;
      const s = Math.max(0, j - 30);
      const cut = line.slice(s, s + 150), body = s > 0 ? cut.replace(/^[\s.,;:!?，。；：、！？]+/, '') : cut;
      return (s > 0 || from > ls ? '…' : '') + body;
    }
  }
  return null;
}
function snippetFor(n, terms, byName) {
  if (byName) return n.snippet; // the hit is already highlighted in the title; show the note's preview
  return snipIn(n.body, terms) || snipIn(n.text, terms) || n.snippet;
}
function runSearch() {
  const q = $('#q').value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  P.terms = terms;
  const res = $('#results');
  if (!terms.length) {
    const recent = visibleNotes().sort((a, b) => b.mtime - a.mtime).slice(0, 8);
    P.items = recent.map((n) => ({ n, group: 'recent' }));
  } else {
    const byName = [], byBody = [];
    for (const n of visibleNotes()) {

      if (terms.every((t) => nameStr.includes(t))) byName.push({ n, group: 'name' });

    }
    const sort = (a, b) => b.n.mtime - a.n.mtime;
    P.items = [...byName.sort(sort), ...byBody.sort(sort)].slice(0, 60);
  }
  P.idx = 0;
  let html = '', g = null;
  const counts = {}; for (const it of P.items) counts[it.group] = (counts[it.group] || 0) + 1;
  P.items.forEach((it, i) => {
    if (it.group !== g) { g = it.group; html += `<div class="pal-g">${esc(tx('g.' + g))} · ${counts[g]}</div>`; }
    const n = it.n;
    const snip = terms.length ? snippetFor(n, terms, it.group === 'name') : n.snippet;
    html += `<button class="res" data-i="${i}">${icon('doc', 20)}<span class="mid"><span class="t">${hl(n.title, terms)}</span><span class="s">${hl(snip || '', terms)}</span></span>` +

}

$('#results').addEventListener('click', (e) => { const b = e.target.closest('.res'); if (b) pickResult(+b.dataset.i); });
async function pickResult(i) {

}
